name: scats-poc

# Object storage: SeaweedFS with its S3 gateway. MinIO's free community images are
# no longer published, so this stack does not use them. Everything in this project
# talks to storage only through the S3 API (S3_ENDPOINT / S3_ACCESS_KEY / S3_SECRET_KEY),
# so another S3-compatible store can replace it by changing the `storage` service.
#
# S3_IMAGE is unpinned on purpose until it has been pulled once on your machine:
# then run `docker compose images`, and set S3_IMAGE in .env to that exact tag.

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scats_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-scats}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"       # localhost only
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scats} -d ${POSTGRES_DB:-scats}"]
      interval: 5s
      timeout: 5s
      retries: 20

  storage:
    image: ${S3_IMAGE:-chrislusf/seaweedfs:latest}
    command: server -dir=/data -volume.max=0 -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"       # S3 API, localhost only
      - "127.0.0.1:${STORAGE_UI_PORT:-9333}:9333" # SeaweedFS master status page
    volumes:
      - storagedata:/data
      - ./config/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

  # One-shot job: waits for the S3 API, creates the three zone buckets, then exits.
  # Uses the API image, so it needs no extra storage-client image.
  storage-init:
    build:
      context: .
      dockerfile: components/07_data_access_api/Dockerfile
    command: ["python", "-m", "app.init_storage"]
    depends_on:
      storage:
        condition: service_started
    environment:
      S3_ENDPOINT: http://storage:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-scatsdev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-scatsdev_secret_pw}
      ZONE_BUCKETS: raw,standardised,derived
    restart: "no"

  api:
    build:
      context: .
      dockerfile: components/07_data_access_api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    environment:
      # Least-privilege role created by db/init/007_products_access.sql (not the superuser): reads two views, appends to query_log.
      DATABASE_URL: postgresql://scats_access:${ACCESS_DB_PASSWORD:-scats_access_dev_pw}@db:5432/${POSTGRES_DB:-scats}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-28800}
      S3_ENDPOINT: http://storage:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-scatsdev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-scatsdev_secret_pw}
      ZONE_BUCKETS: raw,standardised,derived
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"      # localhost only
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  # Phase 2: parser + QC + ingest service. Connects as scats_ingest (db/init/004_ingest_role.sql), not the superuser.
  parser-api:
    build:
      context: .                                       # repo root: the image needs libs/ and the QC package
      dockerfile: components/02_parser_api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://scats_ingest:${INGEST_DB_PASSWORD:-scats_ingest_dev_pw}@db:5432/${POSTGRES_DB:-scats}
      STAGING_DIR: /srv/staging
      INGEST_ALLOWED_DIRS: /srv/data
      INGEST_API_KEY: ${INGEST_API_KEY:-}                # empty = POST /ingest is disabled (set one in .env)
      INGEST_ALLOW_ANONYMOUS: ${INGEST_ALLOW_ANONYMOUS:-false}   # development only
    volumes:
      - ./data:/srv/data:ro                            # raw and test files, read-only
      - stagingdata:/srv/staging
    ports:
      - "127.0.0.1:${PARSER_API_PORT:-8001}:8001"      # localhost only
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/parsers', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Phase 3: review service (login, flag review, approval, publish to Zarr) and its web page.
  # Connects as scats_review (db/init/006_review_auth.sql), not the superuser. Not built in the authoring environment.
  review-api:
    build:
      context: .                                       # repo root: the image needs libs/, ingest, QC and the store library
      dockerfile: components/04_expert_review_ui/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://scats_review:${REVIEW_DB_PASSWORD:-scats_review_dev_pw}@db:5432/${POSTGRES_DB:-scats}
      STAGING_DIR: /srv/staging
      S3_ENDPOINT: http://storage:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-scatsdev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-scatsdev_secret_pw}
      REVIEW_FOUR_EYES: ${REVIEW_FOUR_EYES:-true}
      PUBLISH_ON_APPROVAL: ${PUBLISH_ON_APPROVAL:-true}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}          # set true when served over https
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-28800}
      AUTH_MAX_FAILURES_USER: ${AUTH_MAX_FAILURES_USER:-5}
      AUTH_MAX_FAILURES_IP: ${AUTH_MAX_FAILURES_IP:-20}
      AUTH_WINDOW_SECONDS: ${AUTH_WINDOW_SECONDS:-900}
    volumes:
      - stagingdata:/srv/staging:ro                    # the review service only reads the staging files
    ports:
      - "127.0.0.1:${REVIEW_API_PORT:-8002}:8002"      # localhost only
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Phase 4: builds derived products from PUBLISHED datasets. One-shot, not started by `docker compose up`:
  #   docker compose --profile tools run --rm products
  products:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: components/06_products_pipeline/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://scats_products:${PRODUCTS_DB_PASSWORD:-scats_products_dev_pw}@db:5432/${POSTGRES_DB:-scats}
      S3_ENDPOINT: http://storage:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-scatsdev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-scatsdev_secret_pw}
    restart: "no"

volumes:
  pgdata:
  storagedata:
  stagingdata:
