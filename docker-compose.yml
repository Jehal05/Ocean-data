name: scats-poc

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scats_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-scats}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scats} -d ${POSTGRES_DB:-scats}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-scatsminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-scatsminio_dev_pw}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot job: creates the three zone buckets, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-scatsminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-scatsminio_dev_pw}
    volumes:
      - ./scripts/init_buckets.sh:/init_buckets.sh:ro
    entrypoint: ["/bin/sh", "/init_buckets.sh"]
    restart: "no"

  api:
    build: ./components/07_data_access_api
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-scats}:${POSTGRES_PASSWORD:-scats_dev_pw}@db:5432/${POSTGRES_DB:-scats}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-scatsminio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-scatsminio_dev_pw}
      ZONE_BUCKETS: raw,standardised,derived
    ports:
      - "${API_PORT:-8000}:8000"

volumes:
  pgdata:
  miniodata:
